[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-multilingual-butler"
version = "1.0.0"
description = "Production-ready Telegram Multilingual Translator + Butler AI Bot"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jeevan KB" }]
dependencies = [
    "aiogram>=3.15.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "aiohttp>=3.9.0",
    "google-genai>=0.1.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "edge-tts>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]
